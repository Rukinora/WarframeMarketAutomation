<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tauri App</title>
    <script type="module" src="./main.js"></script>
  </head>

  <body>
    
    <main class="container">
      <div class="top-bar">
        <button class="settings-global">Settings</button>

        <h1 class="title">Warframe Market Automation</h1>

        <button class="delete-global">DeleteAllMods</button>
      </div>
      

      <!-- <div class="row">
        <a href="https://tauri.app" target="_blank">

        </a>
        <a
          href="https://developer.mozilla.org/en-US/docs/Web/JavaScript"
          target="_blank"
        >
          <img
            src="/assets/javascript.svg"
            class="logo vanilla"
            alt="JavaScript logo"
          />

      <div id="container">
        <!-- <div id="left-panel">
          <h2>Controls</h2>
          <button id="startBtn">Start Automation</button>
          <button id="stopBtn">Stop Automation</button>
        </div> -->
        <div id="top-panel">
          
          <div class="grid-container">
            <div class="box">
              <img src="./images/Arbiter.png" alt="Item 1" />
              
              <button class="box-btn">Update Prices</button>
              <button class="box-btn">Add Mods/Update Prices</button>
              
            </div>
            
            <div class="box">
              <img src="./images/Cephalon.png" alt="Item 1" />
              <button class="box-btn">Update Prices</button>
              <button class="box-btn">Add Mods/Update Prices</button>
            </div>
            
            <div class="box">
              <img src="./images/New.png" alt="Item 1" />
              <button class="box-btn">Update Prices</button>
              <button class="box-btn">Add Mods/Update Prices</button>
            </div>

            <div class="box">
              <img src="./images/Steel.png" alt="Item 1" />
              <button class="box-btn">Update Prices</button>
              <button class="box-btn">Add Mods/Update Prices</button>
            </div>

            <div class="box">
              <img src="./images/Red.png" alt="Item 1" />
              <button class="box-btn">Update Prices</button>
              <button class="box-btn">Add Mods/Update Prices</button>
            </div>

            <div class="box">
              <img src="./images/The.png" alt="Item 1" />
              <button class="box-btn">Update Prices</button>
              <button class="box-btn">Add Mods/Update Prices</button>
            </div>
          </div>
        </div>
      </div>
     

      <form class="row-bot" id="bottom-items">

        <!-- Left-middle: Time -->
        <div class="group">
          <label class="bot-text">Time</label>
          <div class="input-row">
            <input id="time-input" placeholder="Enter time (seconds 1.0)" />
            <button id="time-save-btn" type="button">Save</button>
          </div>
        </div>

        <!-- Center: Warframe Link -->
        <div class="group center">
          <label class="bot-text">Warframe Link</label>
          <div class="input-row">
            <input id="greet-input" placeholder="Enter warframe profile link" />
            <button id="greet-save-btn" type="button">Save</button>
          </div>
        </div>

        <!-- Right-middle: Min Plat Price -->
        <div class="group">
          <label class="bot-text">Min Plat Price</label>
          <div class="input-row">
            <input id="min-plat-input" placeholder="Enter price" />
            <button type="button" id="min-plat-save">Save</button>
          </div>
        </div>

      </form>
      
      <p id="greet-msg"></p>
    </main>
  </body>
</html>
